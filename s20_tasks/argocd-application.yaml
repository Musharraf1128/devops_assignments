# Apply this file once by hand. Argo CD then reads gitops-app/
# from GitHub on every push. Do not put this file inside gitops-app/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Musharraf1128/devops_homework.git
    targetRevision: main
    path: s20_tasks/gitops-app

  destination:
    server: https://kubernetes.default.svc
    namespace: session20

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
