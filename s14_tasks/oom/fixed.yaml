apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-c"
        - |
          # FIX: limit raised to 300Mi so the 200MB allocation fits
          print("Allocating memory rapidly...")
          chunks = []
          for i in range(100):
              chunks.append(b"x" * (10 * 1024 * 1024))
          print("Done, sleeping...")
          import time; time.sleep(3600)
      resources:
        limits:
          memory: "300Mi"
