apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-lb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-lb
  template:
    metadata:
      labels:
        app: web-lb
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
